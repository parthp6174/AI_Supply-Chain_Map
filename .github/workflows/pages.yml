name: Refresh prices and publish site

# Rebuilds the three pages and deploys them to GitHub Pages:
#  - on a schedule: every 15 minutes on weekdays, 00:00-21:59 UTC (Tokyo's open through the US close), and every
#    6 hours at weekends; the times sit a few minutes past the hour, away from GitHub's busy :00 slot. GitHub runs
#    scheduled workflows far less often than asked (every 4 to 9 hours for this repository), so between runs the
#    Update desk's Refresh now button is the way to get the latest numbers
#  - on every push to main (for example, after publishing from the Update desk or editing data/developments.json)
#  - on demand from the Actions tab or the Update desk's Refresh now button
#
# Each run reads share prices (Yahoo Finance), headlines for the news radar (Google News, every 3 hours) and the
# market odds shown on The Odds (Polymarket), keeps the last good copy of each between runs, then builds and deploys.
on:
  schedule:
    - cron: "7,22,37,52 0-21 * * 1-5"
    - cron: "7 1,7,13,19 * * 0,6"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      targets:
        description: "Refresh analyst targets: auto (once a day), always, never"
        default: auto
      news:
        description: "Collect headlines: auto (every 3 hours), always, never"
        default: auto

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # carry the last good quotes (including once-a-day analyst targets) and headlines between runs
      - name: Restore last quotes
        uses: actions/cache/restore@v4
        with:
          path: site/data/quotes.json
          key: quotes-${{ github.run_id }}
          restore-keys: quotes-

      - name: Restore last headlines
        uses: actions/cache/restore@v4
        with:
          path: site/data/news.json
          key: news-v2-${{ github.run_id }}
          restore-keys: news-v2-

      - name: Restore last market odds
        uses: actions/cache/restore@v4
        with:
          path: site/data/markets.json
          key: markets-${{ github.run_id }}
          restore-keys: markets-

      - name: Fetch prices from Yahoo Finance
        continue-on-error: true
        run: python scripts/fetch_quotes.py --targets "${{ github.event.inputs.targets || 'auto' }}"

      # on pushes only when there are none yet, so published entries go live quickly; scheduled runs collect every 3 hours
      - name: Collect headlines from Google News
        continue-on-error: true
        run: python scripts/fetch_news.py --mode "${{ github.event_name == 'push' && 'missing' || github.event.inputs.news || 'auto' }}"

      # prices of the forecasting markets listed on drivers in data/odds.json; a market that cannot be read keeps its last price
      - name: Read market odds from Polymarket
        continue-on-error: true
        run: python scripts/fetch_markets.py

      - name: Save quotes
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: site/data/quotes.json
          key: quotes-${{ github.run_id }}

      - name: Save headlines
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: site/data/news.json
          key: news-v2-${{ github.run_id }}

      - name: Save market odds
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: site/data/markets.json
          key: markets-${{ github.run_id }}

      # --lenient: a broken development is left out and listed on the Update desk instead of stopping the site
      - name: Build pages
        run: python src/build.py --target github --quotes site/data/quotes.json --markets site/data/markets.json --lenient

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
